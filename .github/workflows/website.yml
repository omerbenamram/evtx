name: Docs site

on:
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  push:
    branches: [master]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run types:check
      - run: npm run build
        env:
          # Where the site is served from, for absolute links in llms.txt. Set them as
          # repository variables once the site is hosted.
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          DOCS_BASE_PATH: ${{ vars.DOCS_BASE_PATH }}
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: website/out
