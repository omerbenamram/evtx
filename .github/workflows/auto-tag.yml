name: Auto-tag

# Merging a release PR (one that bumps the version in Cargo.toml) tags that commit
# `vX.Y.Z` and runs release.yml for it. Other pushes find the tag already exists and stop.
on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml

permissions:
  contents: read

jobs:
  tag:
    name: Tag new version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Tag the Cargo.toml version if it has no tag
        id: tag
        run: |
          TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to release"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # A tag pushed with GITHUB_TOKEN doesn't trigger release.yml's `push: tags`, so call it directly.
  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.tag }}
    secrets: inherit
