name: CI

on: [pull_request]

jobs:
  release-notes:
    name: Check release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check CHANGELOG.md has notes for the Cargo.toml version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          scripts/release-notes.sh "$VERSION" > /dev/null

  build_and_test:
    name: Test EVTX Library
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Run utf16-simd tests
        run: cargo test --manifest-path utf16-simd/Cargo.toml

  fuzz:
    name: Check fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run every seed through every target
        run: |
          python3 fuzz/seed_corpus.py
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -runs=0
          done

  viewer:
    name: Check web viewer
    runs-on: ubuntu-latest
    # A DuckDB test that can't reach its extension used to block forever; never wait six hours on that again.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: evtx-wasm
      - name: Install wasm-pack
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
      - name: Build evtx-wasm
        run: wasm-pack build evtx-wasm --target web --out-dir evtx-viewer/src/wasm --out-name evtx_wasm --release
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: evtx-wasm/evtx-viewer/package.json
      - name: Check viewer
        working-directory: evtx-wasm/evtx-viewer
        run: |
          bun install --frozen-lockfile
          bun run check
