name: CI

on: [pull_request]

jobs:
  build_and_test:
    name: Test EVTX Library
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Run utf16-simd tests
        run: cargo test --manifest-path utf16-simd/Cargo.toml

  # TEMPORARY (revert before merge): exercise release.yml's macOS PGO build without Homebrew LLVM.
  macos_pgo_check:
    name: macOS PGO check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
          components: llvm-tools
      - name: Setup Rust environment
        shell: bash
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup" >> $GITHUB_ENV
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          LLVM_TOOLS_PATH=$(rustc --print sysroot)/lib/rustlib/${{ matrix.target }}/bin
          echo "PATH=$LLVM_TOOLS_PATH:$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
      - name: Build PGO binary
        run: |
          export TARGET=${{ matrix.target }}
          ./build_pgo.sh
          file target/$TARGET/release/evtx_dump
        env:
          HOME: ${{ github.workspace }}
