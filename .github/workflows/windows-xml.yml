name: Windows XML

# Asks Windows for its own XML of every event in samples/ and in types.evtx,
# a log of typed test events written on the runner (see scripts/windows), and
# uploads the result as an artifact. Copy the artifact's generated/ folder
# over samples/windows to update the fixtures there.
on:
  workflow_dispatch:
  # Probe branch only (never merged): runs on push and pushes results to a branch.
  push:
    branches: [claude/project-thread-j03xxp-winxml-probe]

permissions:
  contents: write

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Render samples
        shell: powershell
        run: ./scripts/windows/render-samples.ps1 -Samples "$env:GITHUB_WORKSPACE\samples" -OutDir "$env:RUNNER_TEMP\windows-xml\samples"
      - name: Generate types.evtx
        shell: powershell
        run: ./scripts/windows/generate-types-sample.ps1 -OutDir "$env:RUNNER_TEMP\windows-xml\generated"
      - name: Render types.evtx
        shell: powershell
        run: ./scripts/windows/render-samples.ps1 -Samples "$env:RUNNER_TEMP\windows-xml\generated" -OutDir "$env:RUNNER_TEMP\windows-xml\generated"
      # Probe branch only: checks the MTA scripts, which share code with scripts/windows.
      - name: MTA probe of the committed fixtures
        if: always()
        shell: powershell
        run: |
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE\samples\mta" "$env:RUNNER_TEMP\windows-xml\mta-committed"
          Remove-Item -Recurse "$env:RUNNER_TEMP\windows-xml\mta-committed\windows", "$env:RUNNER_TEMP\windows-xml\mta-committed\SHA256SUMS"
          ./scripts/mta/generate-mta-samples.ps1 -Phase Probe -OutDir "$env:RUNNER_TEMP\windows-xml\mta-committed" -RepoSamples "$env:GITHUB_WORKSPACE\samples"
      - name: MTA generate
        if: always()
        shell: powershell
        run: ./scripts/mta/generate-mta-samples.ps1 -Phase Generate -OutDir "$env:RUNNER_TEMP\windows-xml\mta-out" -RepoSamples "$env:GITHUB_WORKSPACE\samples"
      - name: MTA probe
        if: always()
        shell: powershell
        run: ./scripts/mta/generate-mta-samples.ps1 -Phase Probe -OutDir "$env:RUNNER_TEMP\windows-xml\mta-out" -RepoSamples "$env:GITHUB_WORKSPACE\samples"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-xml
          path: ${{ runner.temp }}/windows-xml
      - name: Push results to a branch
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$(cygpath "$RUNNER_TEMP")/windows-xml"
          git init -q -b results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Windows XML for $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "results:refs/heads/claude/project-thread-j03xxp-winxml-$GITHUB_RUN_ID"
